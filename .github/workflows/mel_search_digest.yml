name: Mel Search Digest

# Runs daily at 08:05 Europe/London and sends the email digest automatically.
# Can also be triggered manually from: Actions tab → Mel Search Digest → Run workflow.
# Manual runs default to email off; set send_email=true to send on a manual run.
on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email? (true/false)"
        required: false
        default: "false"
        type: string

  schedule:
    - cron: "5 8 * * *"
      timezone: "Europe/London"

jobs:
  search-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Mel's Tavily search digest
        env:
          SEARCH_PROVIDER: tavily
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' && 'true' || inputs.send_email || 'false' }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # M4.18 freeze — final recommended settings baked in as fallback defaults.
          # GitHub Variables (Settings → Secrets and variables → Variables) override
          # these defaults when set, so you can still tune per-run without code changes.
          MAX_SEARCH_QUERIES: ${{ vars.MAX_SEARCH_QUERIES || '10' }}
          MAX_RESULTS_PER_QUERY: ${{ vars.MAX_RESULTS_PER_QUERY || '10' }}
          TAVILY_SEARCH_DEPTH: ${{ vars.TAVILY_SEARCH_DEPTH || 'advanced' }}
          TAVILY_TOPIC: ${{ vars.TAVILY_TOPIC || 'general' }}
          TAVILY_TIME_RANGE: ${{ vars.TAVILY_TIME_RANGE || 'day' }}
          TAVILY_AUTO_PARAMETERS: ${{ vars.TAVILY_AUTO_PARAMETERS || 'false' }}
          TAVILY_QUERY_STYLE: ${{ vars.TAVILY_QUERY_STYLE || 'loose' }}
          # TAVILY_DAYS: requires TAVILY_TOPIC=news — not part of final freeze settings.
          TAVILY_DAYS: ${{ vars.TAVILY_DAYS }}
        run: python run_search.py

      - name: Upload digest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mel-search-digest-${{ github.run_id }}
          path: output/
          retention-days: 30
