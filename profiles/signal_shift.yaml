name: Signal Shift
tagline: "Calm AI-powered market briefing for retail investors"
url: https://signalshift.app

handles:
  founder: "@yourhandle"
  product: "@SignalShiftCo"

positioning:
  what_it_is:
    - calm AI-powered market briefing tool
    - turns noisy market data into plain-English analysis
    - helps retail investors slow down before chasing a stock
    - covers bias, confidence, risk, key reasons, catalyst context, technical context, market/sector context, what to watch, and invalidation

  what_it_is_not:
    - a buy/sell signal app
    - a stock-picking account
    - a trading bot
    - a hype dashboard
    - financial advice
    - a "next 10x stock" tool
    - a Bloomberg or TradingView clone

target_audience:
  - retail investors who feel overwhelmed by market noise
  - investors who want to slow down before acting on a hot tip
  - people who want plain-English reasoning, not raw data dumps
  - investors who are aware of their own biases and want help thinking clearly

voice:
  - calm
  - thoughtful
  - plain-English
  - human
  - not salesy
  - slightly opinionated when useful
  - no hype
  - no financial advice
  - no direct buy/sell language
  - avoid repetitive AI-style line-break formatting

strong_fit_signals:
  - retail investor feeling overwhelmed or chasing noise
  - posts about slowing down before acting on market news
  - posts about investor bias or emotional decision-making
  - posts about wanting clarity instead of more data
  - posts about the difficulty of separating signal from noise

decent_fit_signals:
  - posts about investing frameworks or mental models
  - posts about reducing information overload
  - posts about the difference between data and insight
  - posts that question conventional trading wisdom

weak_fit_signals:
  - technical analysis setups (RSI, MACD, etc.)
  - stock screener discussions
  - day trading or swing trading content
  - posts focused on stock picks without emotional/bias angle

avoid_signals:
  - financial advice or "buy this stock" content
  - hype / moon / rocket emoji culture
  - pump-and-dump style posts
  - get-rich-quick webinars or courses
  - anything that could associate the brand with bad actors

# X post discovery — search terms ordered by reply-target priority (most timely first).
# Terms are phrased like real X users complaining, reflecting, or asking questions.
# Removed: "everyone is bullish/bearish", "stock is ripping/dumping", "market feels broken"
# (these attract low-quality sentiment bait and crypto hype posts).
search_terms:
  - "earnings week is exhausting"
  - "not sure what changed"
  - "stock reaction makes no sense"
  - "stock moved but nothing changed"
  - "hard to separate signal from noise"
  - "retail investors overwhelmed"
  - "investing information overload"
  - "too many market takes"
  - "trying to understand the move"
  - "do your own research noise"
  - "earnings reaction confusing"
  - "overwhelmed by market news"
  - "market noise"
  - "financial media noise"
  - "retail investing is exhausting"
  - "hard to know what matters"
  - "chasing stocks"
  - "investing thesis changed"
  - "why is this stock moving"
  - "too much market data"

# Query templates applied to each search term. Templates are iterated in order
# so the first template (plain quote search) fills MAX_SEARCH_QUERIES first,
# then time-qualified variants fill remaining slots.
# Candidates are generated as: template × term, deduplicated, capped at MAX_SEARCH_QUERIES.
query_templates:
  - 'site:x.com "{term}"'
  - 'site:x.com "{term}" "today"'
  - 'site:x.com "{term}" "this week"'
  - 'site:x.com "{term}" "stocks"'
  - 'site:x.com "{term}" "earnings"'
  - 'site:x.com "{term}" "market"'
  - 'site:x.com "{term}" "retail"'

# Keyword-based fit scoring for real X posts (dynamic, not ID-based)
fit_keywords:
  strong:
    - overwhelmed
    - information overload
    - overload
    - noise
    - clarity
    - bias
    - slow down
    - chasing
    - FOMO
    - emotional
    - panic
    - signal
    - thesis
    - conviction
    - retail investor
    - exhausting
    - confused
    - unclear
    - don't understand
    - doesn't make sense
    - hard to know
    - hard to separate
    - too many takes
  decent:
    - framework
    - mental model
    - discipline
    - process
    - research
    - due diligence
    - data vs insight
    - thinking clearly
    - overreacting
    - reactive
    - financial media
    - market takes
    - stock reaction
    - volatility
    - risk reward
    - investor behavior
  weak:
    - RSI
    - MACD
    - moving average
    - chart pattern
    - day trading
    - swing trade
    - screener
    - entry point
    - exit point
    - technical analysis
    - fear greed
    - bull trap
    - bear trap
    - macro outlook
  avoid:
    - "smart money"
    - "everyone is bullish"
    - "everyone is bearish"
    - "fear is spreading"
    - "highest level since"
    - "link in bio"
    - "screenshot this"
    - "thank me later"
    - "signal group"
    - "join my discord"
    - "free webinar"
    - "paid group"
    - "100x"
    - "buy this"
    - "next 10x"
    - "moon"
    - "🚀"
    - "get rich"
    - "guaranteed"
    - "insider"
    - "pump"
    - "gem"
    - XRP
    - Web3
    - memecoin
    - "meme coin"
    - altcoin
    - "crypto pump"
    - webinar

  # At least one of these must appear for a post to score Strong or Decent fit.
  # Prevents generic "noise/clarity/pressure" posts without market context from
  # being mistaken for investing-related reply targets.
  market_context_required:
    - stock
    - stocks
    - equities
    - market
    - markets
    - investing
    - investor
    - investors
    - trading
    - trader
    - earnings
    - portfolio
    - premarket
    - "after hours"
    - "$"
    - FinTwit
    - "S&P"
    - Nasdaq
    - NYSE
    - CPI
    - ETF
    - IPO
    - "rate cut"
    - "small cap"
    - "mega cap"
    - thesis
    - valuation
    - "stock market"
    - "financial market"
    - "financial media"

  # Off-topic content — sports, entertainment, politics without market context.
  # When present alongside no market context, posts score Weak fit.
  off_topic:
    - "football club"
    - "rugby club"
    - "cricket match"
    - "squad depth"
    - esports
    - "film review"
    - "TV show"

  # Out-of-current-scope market indicators (non-US equity markets).
  # Posts with these terms are downgraded to Low opportunity and excluded from
  # Today's Best 3. They may appear in Save for Inspiration with a scope label.
  out_of_scope_market:
    - rupee
    - INR
    - India
    - Indian
    - Modi
    - Nifty
    - Sensex
    - SEBI
    - RBI
    - FTSE
    - Nikkei
    - "Hang Seng"
    - ASX
    - "Indian market"
    - "Indian stock"
    - "UK market"
    - "UK stock"
    - forex
    - FX
    - "currency pair"

  # US-market context signals for Best 3 eligibility.
  # Web-search posts with Strong/Decent fit but none of these terms are capped
  # at Low opportunity — they may be investing-related but lack clear US scope.
  us_scope_market:
    - "S&P"
    - Nasdaq
    - NYSE
    - Fed
    - "Federal Reserve"
    - CPI
    - earnings
    - premarket
    - "after hours"
    - "Wall Street"
    - "US stocks"
    - "US equities"
    - "US market"
    - "small cap"
    - "mega cap"
    - "$"

# ---------------------------------------------------------------------------
# Structured query buckets for US-equity discovery (M4.12).
# Each bucket is a list of complete Tavily search strings — no template
# substitution needed. The provider selects across buckets to ensure each
# run draws from multiple conversation types rather than only broad-signal
# terms. Buckets are ordered by priority; when MAX_SEARCH_QUERIES is small,
# earlier buckets are preferred.
#
# Liquid US tickers included in starter set:
#   $NVDA $TSLA $PLTR $META $AMD $SOFI $HOOD $COIN $IONQ $APP
#   $AVGO $MSFT $GOOGL $AMZN $SMCI $MSTR $RBLX $CRWD $UBER $NFLX
# ---------------------------------------------------------------------------
query_buckets:

  # Broad psychology/signal posts — anchors Mel's core voice
  broad_signal:
    - 'site:x.com "stock reaction makes no sense"'
    - 'site:x.com "hard to separate signal from noise"'
    - 'site:x.com "retail investors overwhelmed"'
    - 'site:x.com "investing information overload"'
    - 'site:x.com "market noise"'
    - 'site:x.com "earnings week is exhausting"'
    - 'site:x.com "too many market takes"'
    - 'site:x.com "why is this stock moving"'
    - 'site:x.com "not sure what changed"'
    - 'site:x.com "trying to understand the move"'

  # Reactions to earnings beats/misses on specific US names
  earnings_reaction:
    - 'site:x.com "earnings reaction" "$"'
    - 'site:x.com "sold off after earnings" "$"'
    - 'site:x.com "ripping after earnings" "$"'
    - 'site:x.com "$NVDA" "earnings reaction"'
    - 'site:x.com "$TSLA" "earnings reaction"'
    - 'site:x.com "$META" "sold off after earnings"'
    - 'site:x.com "$AMD" "earnings reaction"'
    - 'site:x.com "$MSFT" "earnings reaction"'
    - 'site:x.com "$GOOGL" "earnings reaction"'
    - 'site:x.com "$AMZN" "earnings reaction"'
    - 'site:x.com "$NFLX" "earnings reaction"'
    - 'site:x.com "$SOFI" "earnings reaction"'
    - 'site:x.com "$HOOD" "earnings reaction"'

  # "Why is this moving?" confusion posts on liquid names
  ticker_confusion:
    - 'site:x.com "$NVDA" "why is it moving"'
    - 'site:x.com "$TSLA" "makes no sense"'
    - 'site:x.com "$PLTR" "why is this moving"'
    - 'site:x.com "$META" "why is this moving"'
    - 'site:x.com "$AMD" "why is this moving"'
    - 'site:x.com "$SOFI" "makes no sense"'
    - 'site:x.com "$COIN" "why is it moving"'
    - 'site:x.com "why is this stock moving" "$"'
    - 'site:x.com "stock makes no sense" "$"'
    - 'site:x.com "market reaction makes no sense" "$"'
    - 'site:x.com "$SMCI" "makes no sense"'
    - 'site:x.com "$APP" "why is this moving"'
    - 'site:x.com "$CRWD" "why is this moving"'

  # Premarket and after-hours confusion and chatter
  premarket_afterhours:
    - 'site:x.com "premarket" "why is" "$"'
    - 'site:x.com "after hours" "why is" "$"'
    - 'site:x.com "$HOOD" "premarket"'
    - 'site:x.com "$COIN" "after hours"'
    - 'site:x.com "$NVDA" "premarket"'
    - 'site:x.com "$TSLA" "premarket"'
    - 'site:x.com "$MSTR" "after hours"'
    - 'site:x.com "$PLTR" "premarket"'

  # AI-stock hype, bubble talk, and chasing narratives
  ai_stock_hype:
    - 'site:x.com "AI stocks" "chasing"'
    - 'site:x.com "AI stock" "bubble" "$"'
    - 'site:x.com "$NVDA" "AI hype"'
    - 'site:x.com "$PLTR" "retail chasing"'
    - 'site:x.com "$IONQ" "retail chasing"'
    - 'site:x.com "AI stock" "ripping after earnings"'
    - 'site:x.com "$APP" "ripping after earnings"'
    - 'site:x.com "$AVGO" "AI"'
    - 'site:x.com "$NVDA" "chasing"'

  # Retail FOMO and momentum-chasing behaviour
  retail_chasing:
    - 'site:x.com "retail is chasing" "$"'
    - 'site:x.com "chasing stocks" "$"'
    - 'site:x.com "$MSTR" "retail chasing"'
    - 'site:x.com "$RBLX" "why is this moving"'
    - 'site:x.com "$SMCI" "retail chasing"'
    - 'site:x.com "FOMO" "buying" "$"'
    - 'site:x.com "$HOOD" "retail chasing"'
    - 'site:x.com "$UBER" "retail chasing"'

  # Thesis-unchanged vs. stock-moved conflict posts
  thesis_changed:
    - 'site:x.com "$PLTR" "thesis changed"'
    - 'site:x.com "$TSLA" "nothing changed"'
    - 'site:x.com "nothing changed" "stock" "$"'
    - 'site:x.com "thesis changed" "$"'
    - 'site:x.com "investing thesis changed" "$"'
    - 'site:x.com "$NVDA" "thesis changed"'
    - 'site:x.com "$CRWD" "thesis changed"'
    - 'site:x.com "the chart moved" "$"'

  # Selloff or rally that doesn't match fundamentals
  selloff_rally_confusion:
    - 'site:x.com "selloff makes no sense" "$"'
    - 'site:x.com "rally makes no sense" "$"'
    - 'site:x.com "$CRWD" "sold off"'
    - 'site:x.com "$UBER" "rally"'
    - 'site:x.com "$NFLX" "sold off after earnings"'
    - 'site:x.com "not sure what changed" "$"'
    - 'site:x.com "$COIN" "selloff"'
    - 'site:x.com "$MSTR" "rally"'

  # Loose (unquoted) variants — broader matching, more likely to surface fresh posts.
  # No double-quotes so TAVILY_QUERY_STYLE=loose will prefer these.
  # Complements the exact quoted queries in the buckets above.
  loose_discovery:
    - site:x.com NVDA earnings reaction today
    - site:x.com TSLA premarket confusing
    - site:x.com PLTR stock reaction confused
    - site:x.com META sold off earnings
    - site:x.com AMD after hours why moving
    - site:x.com earnings reaction today stock
    - site:x.com premarket movers confused stock
    - site:x.com AI stocks chasing today
    - site:x.com stock sold off after earnings
    - site:x.com why stock moving today
    - site:x.com NVDA why is this moving
    - site:x.com TSLA makes no sense today
    - site:x.com retail investor overwhelmed stocks
    - site:x.com investing thesis unchanged stock moving
    - site:x.com information overload stocks

  # Topic/ticker discovery — today-style market mover queries.
  # Intended to surface timely posts for Worth Checking or Save for Inspiration
  # even when they don't match exact phrase patterns.
  market_movers:
    - site:x.com US stocks moving today
    - site:x.com premarket movers today stocks
    - site:x.com earnings today stocks reaction
    - site:x.com AI stocks moving today
    - site:x.com retail traders chasing stocks today
    - site:x.com stock market confused today
    - site:x.com market reaction today retail
